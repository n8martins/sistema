plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sistema.home'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sistema.home'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress 'ttf'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'preview.out', "${layout.buildDirectory.get().asFile}/preview"
            }
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
